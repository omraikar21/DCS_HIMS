services:
  # Backend API Web Service
  - type: web
    name: dcs-hims-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: DATABASE_URL
        fromDatabase:
          name: dcs-hims-db
          property: connectionString
      - key: CLIENT_URL
        fromService:
          type: static
          name: dcs-hims-client
          property: url

  # Frontend Client Static Site
  - type: static
    name: dcs-hims-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: dcs-hims-server
          property: url
          value: https://${dcs-hims-server.render.internal}/api

databases:
  - name: dcs-hims-db
    plan: free
    databaseName: dcs_hims
    user: dcshims_user
